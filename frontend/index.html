<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.add-btn {
      padding: 12px 20px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button.add-btn:hover { background: #7dd3fc; }

    .todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #1e293b;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }

    .todo-item.done { opacity: 0.45; }

    .todo-item .text {
      flex: 1;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .todo-item.done .text {
      text-decoration: line-through;
      color: #64748b;
    }

    .check-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #38bdf8;
      font-size: 14px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .todo-item.done .check-btn {
      background: #38bdf8;
      color: #0f172a;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      transition: color 0.2s;
    }

    .del-btn:hover { color: #f87171; }

    .empty {
      text-align: center;
      color: #334155;
      margin-top: 40px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo App</h1>
    <p class="subtitle">Docker + Jenkins Demo Project</p>

    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a new task..." />
      <button class="add-btn" onclick="addTodo()">Add</button>
    </div>

    <ul class="todo-list" id="todoList">
      <li class="empty" id="emptyMsg">Loading...</li>
    </ul>
  </div>

  <script>
    const API = "http://localhost:5000/api/todos";

    async function fetchTodos() {
      try {
        const res = await fetch(API);
        const todos = await res.json();
        render(todos);
      } catch {
        document.getElementById("emptyMsg").textContent = "⚠️ Could not connect to backend.";
      }
    }

    function render(todos) {
      const list = document.getElementById("todoList");
      const empty = document.getElementById("emptyMsg");
      list.innerHTML = "";
      if (todos.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No tasks yet. Add one above!";
        list.appendChild(li);
        return;
      }
      todos.forEach(todo => {
        const li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");
        li.innerHTML = `
          <button class="check-btn" onclick="toggleTodo(${todo.id})">✓</button>
          <span class="text" onclick="toggleTodo(${todo.id})">${todo.text}</span>
          <button class="del-btn" onclick="deleteTodo(${todo.id})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const input = document.getElementById("todoInput");
      const text = input.value.trim();
      if (!text) return;
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      input.value = "";
      fetchTodos();
    }

    async function toggleTodo(id) {
      await fetch(`${API}/${id}`, { method: "PATCH" });
      fetchTodos();
    }

    async function deleteTodo(id) {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      fetchTodos();
    }

    document.getElementById("todoInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });

    fetchTodos();
  </script>
</body>
</html>
